[project]
name = "jewel-coupon-clipper"
version = "2.0.0"
description = "Automated coupon clipper for Jewel-Osco and other Albertsons-family banners"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apprise>=1.13.1",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
plugins = ['pydantic.mypy']

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
